name: FieldOps Agent CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-test-and-build:
    name: Lint, Test, Evaluate & Docker Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fieldops
          POSTGRES_USER: fieldops
          POSTGRES_PASSWORD: fieldops
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://fieldops:fieldops@localhost:5432/fieldops
      REDIS_URL: redis://localhost:6379/0
      CHECKPOINTER_BACKEND: sqlite
      APP_ENV: test
      OPENAI_API_KEY: sk-proj-test-mock-key
      WEBHOOK_SHARED_SECRET: fieldops-webhook-secret-dev
      ALLOW_FAKE_INTEGRATIONS_IN_PRODUCTION: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check src tests evaluation scripts
          ruff format --check src tests evaluation scripts

      - name: Run Test Suite (Pytest)
        run: |
          pytest tests/ -v

      - name: Database Migration Verification (Alembic)
        run: |
          alembic upgrade head

      - name: Seed Database Verification
        run: |
          python scripts/seed.py

      - name: Run Deterministic Agent Evaluations
        run: |
          python evaluation/run_workflow_eval.py
          python evaluation/run_matching_eval.py
          python evaluation/run_scheduling_eval.py

      - name: Security Vulnerability Scan (pip-audit)
        run: |
          pip-audit --desc || echo "Audit completed with advisory review"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: fieldops-agent:ci
