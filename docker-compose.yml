services:
  postgres:
    image: postgres:16
    container_name: fieldops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fieldops
      POSTGRES_USER: fieldops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldops -d fieldops"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fieldops-net

  redis:
    image: redis:7-alpine
    container_name: fieldops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fieldops-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fieldops-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with your database credentials}
      REDIS_URL: redis://redis:6379/0
      CHECKPOINTER_BACKEND: postgres
      ALLOW_FAKE_INTEGRATIONS_IN_PRODUCTION: "true"
      WEBHOOK_SHARED_SECRET: ${WEBHOOK_SHARED_SECRET:?Set WEBHOOK_SHARED_SECRET}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      BUSINESS_TIMEZONE: Asia/Tokyo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: ["uvicorn", "fieldops.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    networks:
      - fieldops-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fieldops-worker
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with your database credentials}
      REDIS_URL: redis://redis:6379/0
      CHECKPOINTER_BACKEND: postgres
      ALLOW_FAKE_INTEGRATIONS_IN_PRODUCTION: "true"
      WEBHOOK_SHARED_SECRET: ${WEBHOOK_SHARED_SECRET:?Set WEBHOOK_SHARED_SECRET}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      BUSINESS_TIMEZONE: Asia/Tokyo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "fieldops.tasks.celery_app", "worker", "--loglevel=info", "-c", "2"]
    networks:
      - fieldops-net

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fieldops-beat
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with your database credentials}
      REDIS_URL: redis://redis:6379/0
      CHECKPOINTER_BACKEND: postgres
      ALLOW_FAKE_INTEGRATIONS_IN_PRODUCTION: "true"
      WEBHOOK_SHARED_SECRET: ${WEBHOOK_SHARED_SECRET:?Set WEBHOOK_SHARED_SECRET}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    command: ["celery", "-A", "fieldops.tasks.celery_app", "beat", "--loglevel=info"]
    networks:
      - fieldops-net

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: fieldops-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fieldops-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: fieldops-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - fieldops-net

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  fieldops-net:
    driver: bridge
